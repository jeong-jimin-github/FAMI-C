<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">화미-씨 FAMI-C</title>
  <desc id="desc">1980년대 한국 전자회사 상표와 컴퓨터 책자 조판을 모티브로 한 화미-씨 로고. 훼밀리 콤퓨타 6502 飜譯機.</desc>
  <g fill="none" fill-rule="evenodd">
    <!-- 독자적인 기하학 심벌: 당시 2도 인쇄를 의식한 단순 도형 -->
    <g transform="translate(34 42)">
      <rect x="3" y="3" width="228" height="228" rx="18" stroke="#bd232c" stroke-width="10"/>
      <path d="M24 24h79c0 44-35 79-79 79V24Zm186 0v79c-44 0-79-35-79-79h79Zm0 186h-79c0-44 35-79 79-79v79ZM24 210v-79c44 0 79 35 79 79H24Z" fill="#bd232c"/>
      <path d="M117 72l14 31 31 14-31 14-14 31-14-31-31-14 31-14 14-31Z" fill="#f3edda"/>
      <rect x="20" y="246" width="194" height="12" fill="#223d5b"/>
      <rect x="20" y="267" width="126" height="7" fill="#bd232c"/>
      <text x="158" y="276" fill="#223d5b" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">1983</text>
    </g>

    <!-- 주 워드마크 -->
    <g transform="translate(300 42)">
      <text x="0" y="142" fill="#171814" font-family="Arial Black, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="142" font-weight="900" letter-spacing="-10">화미-씨</text>
      <rect x="2" y="168" width="825" height="7" fill="#bd232c"/>
      <text x="4" y="246" fill="#bd232c" font-family="Arial Black, Helvetica, sans-serif" font-size="72" font-weight="900" letter-spacing="3">FAMI-C</text>
      <text x="405" y="241" fill="#223d5b" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="31" font-weight="700" letter-spacing="1">훼밀리 콤퓨타 · 6502 飜譯機</text>
      <rect x="4" y="266" width="825" height="3" fill="#223d5b"/>
      <text x="4" y="306" fill="#4a4941" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="23" letter-spacing="1.5">家庭用 8비트 마이크로 콤퓨타 프로그램 번역 체계</text>
    </g>
  </g>
</svg>
